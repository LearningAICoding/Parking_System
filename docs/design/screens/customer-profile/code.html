<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ sơ cá nhân - ParkCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4" style="max-width: 720px">
    <header class="mb-4">
      <p class="text-uppercase text-primary small fw-semibold mb-1">Tài khoản CUSTOMER</p>
      <h1 class="h3 mb-1">Hồ sơ cá nhân</h1>
      <p class="text-secondary mb-0">Cập nhật thông tin liên hệ dùng cho quản lý xe và vé.</p>
    </header>

    <form method="post" action="/profile" class="card border-0 shadow-sm p-4" novalidate>
      <input type="hidden" name="_csrf" value="{{csrfToken}}">
      <div class="row g-3">
        <div class="col-12">
          <label for="fullName" class="form-label">Họ và tên</label>
          <input id="fullName" name="fullName" class="form-control" autocomplete="name" required>
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label">Số điện thoại</label>
          <input id="phone" name="phone" class="form-control" inputmode="tel" autocomplete="tel" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="col-12">
          <label for="address" class="form-label">Địa chỉ</label>
          <textarea id="address" name="address" class="form-control" rows="3" autocomplete="street-address"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-4">
        <a class="btn btn-outline-secondary" href="/">Hủy</a>
        <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
      </div>
    </form>
  </main>
</body>
</html>
